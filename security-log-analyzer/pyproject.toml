[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-auth-detection"
version = "0.1.0"
description = "Explainable authentication-log threat detection"
requires-python = ">=3.9"

[project.scripts]
sentinel = "sentinel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
